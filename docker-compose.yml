name: Poste-Pionnier-2025-2026

services:
  postgres:
    image: postgres:17
    container_name: Poste-Pionnier-2025-2026-postgres
    environment:
      POSTGRES_DB: Poste-Pionnier-2025-2026
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Poste-Pionnier-2025-2026"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: Poste-Pionnier-2025-2026-app
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./apps/web/.env
      - ./apps/native/.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:password@postgres:5432/Poste-Pionnier-2025-2026
      BETTER_AUTH_URL: http://localhost:3001
      CORS_ORIGIN: http://localhost:3001
      POLAR_SUCCESS_URL: http://localhost:3001/success?checkout_id={CHECKOUT_ID}
      EXPO_PUBLIC_SERVER_URL: ${EXPO_PUBLIC_SERVER_URL:-http://localhost:3001}
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      EXPO_DEVTOOLS_LISTEN_ADDRESS: 0.0.0.0
      CI: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3001"
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    stdin_open: true
    tty: true
    volumes:
      - .:/workspace
      - pnpm-store:/pnpm/store
      - root-node-modules:/workspace/node_modules
      - native-node-modules:/workspace/apps/native/node_modules
      - web-node-modules:/workspace/apps/web/node_modules
      - api-node-modules:/workspace/packages/api/node_modules
      - auth-node-modules:/workspace/packages/auth/node_modules
      - config-node-modules:/workspace/packages/config/node_modules
      - db-node-modules:/workspace/packages/db/node_modules
      - env-node-modules:/workspace/packages/env/node_modules
      - hooks-node-modules:/workspace/packages/hooks/node_modules
    command: >
      sh -c "pnpm install --frozen-lockfile
      && pnpm db:generate
      && pnpm db:push
      && pnpm exec turbo dev --ui=stream"

volumes:
  postgres-data:
  pnpm-store:
  root-node-modules:
  native-node-modules:
  web-node-modules:
  api-node-modules:
  auth-node-modules:
  config-node-modules:
  db-node-modules:
  env-node-modules:
  hooks-node-modules:
